<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - FF Bazar</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f3f5fa;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
width:95%;
max-width:400px;
background:#fff;
padding:25px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.15);
}

.logo{
font-size:30px;
font-weight:bold;
text-align:center;
color:#0066ff;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:13px;
background:#0066ff;
color:#fff;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#004ecc;
}

p{
margin-top:15px;
text-align:center;
}

a{
text-decoration:none;
color:#0066ff;
font-weight:bold;
}
</style>

</head>

<body>

<div class="box">

<div class="logo">FF BAZAR</div>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button>Login</button>

<p>
Don't have an account?
<a href="register.html">Register</a>
</p>

</div>

</body>
</html>
