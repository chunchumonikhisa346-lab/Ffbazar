<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders - FF Bazar</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6fb;
}

.header{
background:#0066ff;
color:#fff;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
width:95%;
max-width:500px;
margin:20px auto;
}

.order{
background:#fff;
padding:15px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.order h3{
color:#0066ff;
margin-bottom:10px;
}

.order p{
margin:6px 0;
}

.status{
display:inline-block;
padding:6px 12px;
background:#28a745;
color:#fff;
border-radius:20px;
font-size:14px;
margin-top:8px;
}

.back{
display:block;
margin:20px auto;
width:180px;
text-align:center;
padding:12px;
background:#0066ff;
color:#fff;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}
</style>

</head>
<body>

<div class="header">
My Orders
</div>

<div class="container">

<div class="order">
<h3>Free Fire Weekly</h3>
<p><b>Order ID:</b> #10001</p>
<p><b>UID:</b> 123456789</p>
<p><b>Amount:</b> ৳170</p>
<span class="status">Completed</span>
</div>

<div class="order">
<h3>100 Diamond</h3>
<p><b>Order ID:</b> #10002</p>
<p><b>UID:</b> 987654321</p>
<p><b>Amount:</b> ৳85</p>
<span class="status" style="background:orange;">Pending</span>
</div>

<a href="profile.html" class="back">⬅ Back to Profile</a>

</div>

</body>
</html>
