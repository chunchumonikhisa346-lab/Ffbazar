<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF Bazar</title>

<link rel="stylesheet" href="style.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6fb;
}

header{
background:#fff;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.logo{
font-size:30px;
font-weight:bold;
color:#0b56d8;
}

.login{
background:#0b56d8;
color:#fff;
padding:10px 18px;
border-radius:8px;
text-decoration:none;
}

.notice{
background:#0b56d8;
color:#fff;
margin:15px;
padding:15px;
border-radius:8px;
}

.slider{
margin:15px;
height:180px;
border-radius:12px;
background:#ddd;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
font-weight:bold;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
padding:15px;
}

.btn{
background:#0b56d8;
color:#fff;
padding:15px;
border-radius:10px;
text-align:center;
text-decoration:none;
}

.title{
text-align:center;
font-size:32px;
font-weight:bold;
margin:20px 0;
}

.cards{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:15px;
}

.card{
background:#fff;
border-radius:12px;
padding:10px;
text-align:center;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.card img{
width:100%;
border-radius:10px;
}

.card h3{
margin-top:10px;
font-size:17px;
}

.bottom{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-around;
padding:12px;
box-shadow:0 -2px 10px rgba(0,0,0,.2);
}
</style>

</head>
<body>

<header>

<div class="logo">
FF Bazar
</div>

<a class="login" href="login.html">
Login
</a>

</header>

<div class="notice">
<b>Notice:</b><br>
১৮ বছরের নিচে কেউ অর্ডার করবেন না।
</div>

<div class="slider">
Slider Banner
</div>

<div class="buttons">

<a class="btn" href="#">Telegram</a>

<a class="btn" href="#">Join Group</a>

</div>

<div class="title">
FREE FIRE
</div>

<div class="cards">

<div class="card">
<img src="images/card1.png">
<h3>UID TopUp</h3>
</div>

<div class="card">
<img src="images/card2.png">
<h3>Weekly</h3>
</div>

<div class="card">
<img src="images/card3.png">
<h3>Monthly</h3>
</div>

<div class="card">
<img src="images/card4.png">
<h3>Evo Access</h3>
</div>

<div class="card">
<img src="images/card5.png">
<h3>Level Up</h3>
</div>

<div class="card">
<img src="images/card6.png">
<h3>Lite</h3>
</div>

</div>

<div style="height:80px"></div>

<div class="bottom">

Home

Tutorial

TopUp

Contact

</div>

</body>
  </html>
