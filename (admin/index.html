<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF Bazar Admin</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6fb;
}

header{
background:#0066ff;
color:#fff;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
width:95%;
max-width:1100px;
margin:20px auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:#fff;
padding:25px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
text-align:center;
}

.card h2{
color:#0066ff;
margin-bottom:15px;
}

.card a{
display:block;
background:#0066ff;
color:#fff;
padding:12px;
border-radius:8px;
text-decoration:none;
}

.logout{
width:200px;
margin:30px auto;
display:block;
background:red;
color:#fff;
padding:15px;
text-align:center;
border-radius:10px;
text-decoration:none;
}
</style>

</head>
<body>

<header>
FF BAZAR ADMIN PANEL
</header>

<div class="container">

<div class="card">
<h2>Products</h2>
<a href="products.html">Manage Products</a>
</div>

<div class="card">
<h2>Orders</h2>
<a href="orders.html">View Orders</a>
</div>

<div class="card">
<h2>Add Money</h2>
<a href="add-money.html">Deposit Requests</a>
</div>

<div class="card">
<h2>Users</h2>
<a href="users.html">All Users</a>
</div>

<div class="card">
<h2>Slider</h2>
<a href="slider.html">Manage Slider</a>
</div>

<div class="card">
<h2>Notice</h2>
<a href="notice.html">Edit Notice</a>
</div>

</div>

<a class="logout" href="../login.html">
Logout
</a>

</body>
</html>
