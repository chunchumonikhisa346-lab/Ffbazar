<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Money Requests</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6fb;
}

header{
background:#0066ff;
color:#fff;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
width:95%;
max-width:1000px;
margin:20px auto;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

th{
background:#0066ff;
color:#fff;
padding:12px;
}

td{
padding:12px;
text-align:center;
border-bottom:1px solid #ddd;
}

button{
padding:8px 14px;
border:none;
border-radius:6px;
color:#fff;
cursor:pointer;
margin:2px;
}

.approve{
background:#28a745;
}

.reject{
background:#dc3545;
}
</style>

</head>
<body>

<header>
Add Money Requests
</header>

<div class="container">

<table>

<tr>
<th>User</th>
<th>Method</th>
<th>Amount</th>
<th>Sender</th>
<th>TRX ID</th>
<th>Action</th>
</tr>

<tr>
<td>Eshan</td>
<td>bKash</td>
<td>500৳</td>
<td>01873786543</td>
<td>BK45879</td>
<td>
<button class="approve">Approve</button>
<button class="reject">Reject</button>
</td>
</tr>

<tr>
<td>Player01</td>
<td>Nagad</td>
<td>1000৳</td>
<td>01873786543</td>
<td>NG99881</td>
<td>
<button class="approve">Approve</button>
<button class="reject">Reject</button>
</td>
</tr>

</table>

</div>

</body>
</html>
