<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notice Management</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6fb;
}

header{
background:#0066ff;
color:#fff;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
width:95%;
max-width:700px;
margin:20px auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

label{
display:block;
margin-bottom:10px;
font-weight:bold;
}

textarea{
width:100%;
height:150px;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
resize:none;
font-size:16px;
}

button{
width:100%;
margin-top:20px;
padding:14px;
background:#0066ff;
color:#fff;
border:none;
border-radius:8px;
font-size:17px;
cursor:pointer;
}

.preview{
margin-top:20px;
padding:15px;
background:#fff8dc;
border-left:5px solid orange;
border-radius:8px;
}

.success{
display:none;
margin-top:15px;
padding:10px;
background:#d4edda;
color:#155724;
border-radius:8px;
text-align:center;
}
</style>
</head>

<body>

<header>
Notice Management
</header>

<div class="container">

<label>Website Notice</label>

<textarea id="notice">
🔥 Welcome To FF Bazar
💎 Instant Top Up Service
📢 24/7 Customer Support
</textarea>

<button onclick="saveNotice()">
Save Notice
</button>

<div class="success" id="success">
Notice Saved Successfully!
</div>

<div class="preview">
<h3>Preview</h3>
<p id="previewText">
🔥 Welcome To FF Bazar<br>
💎 Instant Top Up Service<br>
📢 24/7 Customer Support
</p>
</div>

</div>

<script>

const notice=document.getElementById("notice");
const preview=document.getElementById("previewText");

notice.onkeyup=function(){
preview.innerHTML=this.value.replace(/\n/g,"<br>");
}

function saveNotice(){

localStorage.setItem("notice",notice.value);

document.getElementById("success").style.display="block";

setTimeout(()=>{
document.getElementById("success").style.display="none";
},2000);

}

</script>

</body>
  </html>
