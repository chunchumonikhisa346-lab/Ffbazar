<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF Bazar - Products</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#f5f5f5;}
header{
background:#0066ff;
color:#fff;
padding:15px;
text-align:center;
font-size:24px;
font-weight:bold;
}
.container{
max-width:500px;
margin:20px auto;
padding:10px;
}
.card{
background:#fff;
padding:15px;
border-radius:10px;
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}
.price{
color:#0066ff;
font-weight:bold;
font-size:18px;
}
button{
background:#0066ff;
color:#fff;
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}
button:hover{
background:#004ec2;
}
</style>
</head>

<body>

<header>Free Fire Diamond</header>

<div class="container">

<div class="card">
<div>
<h3>25 Diamond</h3>
<p class="price">৳25</p>
</div>
<button onclick="buy('25 Diamond',25)">Buy Now</button>
</div>

<div class="card">
<div>
<h3>50 Diamond</h3>
<p class="price">৳42</p>
</div>
<button onclick="buy('50 Diamond',42)">Buy Now</button>
</div>

<div class="card">
<div>
<h3>115 Diamond</h3>
<p class="price">৳85</p>
</div>
<button onclick="buy('115 Diamond',85)">Buy Now</button>
</div>

<div class="card">
<div>
<h3>240 Diamond</h3>
<p class="price">৳170</p>
</div>
<button onclick="buy('240 Diamond',170)">Buy Now</button>
</div>

<div class="card">
<div>
<h3>Weekly Membership</h3>
<p class="price">৳170</p>
</div>
<button onclick="buy('Weekly Membership',170)">Buy Now</button>
</div>

<div class="card">
<div>
<h3>Monthly Membership</h3>
<p class="price">৳760</p>
</div>
<button onclick="buy('Monthly Membership',760)">Buy Now</button>
</div>

</div>

<script>
function buy(product,price){
localStorage.setItem("product",product);
localStorage.setItem("price",price);
window.location="order.html";
}
</script>

</body>
  </html>
