<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - FF Bazar</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0066ff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
background:#fff;
padding:30px;
border-radius:12px;
width:350px;
box-shadow:0 5px 20px rgba(0,0,0,.2);
}

h2{
text-align:center;
margin-bottom:20px;
color:#0066ff;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:12px;
background:#0066ff;
color:#fff;
border:none;
border-radius:8px;
font-size:17px;
cursor:pointer;
}

button:hover{
background:#0052cc;
}

.error{
color:red;
text-align:center;
margin-top:10px;
display:none;
}
</style>

</head>
<body>

<div class="login-box">

<h2>Admin Login</h2>

<input type="text" id="username" placeholder="Admin Username">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<p class="error" id="error">
Invalid Username or Password
</p>

</div>

<script>

function login(){

let user=document.getElementById("username").value;
let pass=document.getElementById("password").value;

if(user==="admin" && pass==="123456"){

window.location="index.html";

}else{

document.getElementById("error").style.display="block";

}

}

</script>

</body>
  </html>
