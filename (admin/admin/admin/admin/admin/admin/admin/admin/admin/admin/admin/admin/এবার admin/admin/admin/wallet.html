<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wallet - FF Bazar</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6fb;
}

header{
background:#0066ff;
color:#fff;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
width:95%;
max-width:450px;
margin:20px auto;
}

.balance{
background:#0066ff;
color:#fff;
padding:20px;
border-radius:12px;
text-align:center;
margin-bottom:20px;
}

.balance h1{
font-size:40px;
margin-top:10px;
}

.card{
background:#fff;
padding:15px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.btn{
display:block;
width:100%;
padding:14px;
text-align:center;
background:#0066ff;
color:#fff;
text-decoration:none;
border-radius:8px;
margin-top:15px;
}

.green{
background:#28a745;
}
</style>

</head>
<body>

<header>
My Wallet
</header>

<div class="container">

<div class="balance">
<h3>Current Balance</h3>
<h1>৳0.00</h1>
</div>

<div class="card">
<h3>Add Money</h3>
<p>Deposit money using bKash or Nagad.</p>
<a href="add-money.html" class="btn">Add Money</a>
</div>

<div class="card">
<h3>Transaction History</h3>
<p>No transactions found.</p>
</div>

<div class="card">
<h3>Withdraw</h3>
<p>Withdraw your wallet balance.</p>
<a href="withdraw.html" class="btn green">Withdraw</a>
</div>

</div>

</body>
</html>
