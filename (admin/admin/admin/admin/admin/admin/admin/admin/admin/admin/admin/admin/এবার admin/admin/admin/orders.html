<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
}

header{
background:#0066ff;
color:#fff;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
width:95%;
max-width:900px;
margin:20px auto;
}

.card{
background:#fff;
padding:15px;
border-radius:10px;
margin-bottom:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.status{
font-weight:bold;
padding:5px 10px;
border-radius:5px;
display:inline-block;
}

.pending{
background:#fff3cd;
color:#856404;
}

.success{
background:#d4edda;
color:#155724;
}

.cancel{
background:#f8d7da;
color:#721c24;
}
</style>

</head>

<body>

<header>
My Orders
</header>

<div class="container">

<div class="card">
<h3>Weekly Membership</h3>
<p>Order ID : #1001</p>
<p>Price : ৳170</p>
<p>Status :
<span class="status pending">
Pending
</span>
</p>
</div>

<div class="card">
<h3>100 Diamond</h3>
<p>Order ID : #1002</p>
<p>Price : ৳85</p>
<p>Status :
<span class="status success">
Completed
</span>
</p>
</div>

<div class="card">
<h3>Monthly Membership</h3>
<p>Order ID : #1003</p>
<p>Price : ৳760</p>
<p>Status :
<span class="status cancel">
Cancelled
</span>
</p>
</div>

</div>

</body>
  </html>
