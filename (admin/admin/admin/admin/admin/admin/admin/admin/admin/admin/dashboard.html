<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - FF Bazar Admin</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6fb;
}

header{
background:#0066ff;
color:#fff;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
width:95%;
max-width:1200px;
margin:20px auto;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
text-align:center;
}

.card h2{
color:#0066ff;
font-size:30px;
margin-bottom:10px;
}

.card p{
font-size:18px;
font-weight:bold;
}

.table-box{
margin-top:30px;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#0066ff;
color:#fff;
padding:12px;
}

td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:center;
}
</style>

</head>
<body>

<header>
FF BAZAR ADMIN DASHBOARD
</header>

<div class="container">

<div class="cards">

<div class="card">
<h2>120</h2>
<p>Total Users</p>
</div>

<div class="card">
<h2>85</h2>
<p>Total Orders</p>
</div>

<div class="card">
<h2>৳25,450</h2>
<p>Total Sales</p>
</div>

<div class="card">
<h2>18</h2>
<p>Pending Orders</p>
</div>

</div>

<div class="table-box">

<h2 style="margin-bottom:15px;">Recent Orders</h2>

<table>

<tr>
<th>Order ID</th>
<th>User</th>
<th>Product</th>
<th>Status</th>
</tr>

<tr>
<td>#1001</td>
<td>Eshan</td>
<td>Weekly</td>
<td style="color:green;">Completed</td>
</tr>

<tr>
<td>#1002</td>
<td>Player01</td>
<td>100 Diamond</td>
<td style="color:orange;">Pending</td>
</tr>

<tr>
<td>#1003</td>
<td>Rahim</td>
<td>Monthly</td>
<td style="color:green;">Completed</td>
</tr>

</table>

</div>

</div>

</body>
</html>
