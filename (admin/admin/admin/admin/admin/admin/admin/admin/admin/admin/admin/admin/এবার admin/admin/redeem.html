<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redeem Code - FF Bazar Admin</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6fb;
}

header{
background:#0066ff;
color:#fff;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
max-width:700px;
margin:20px auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:#0066ff;
color:#fff;
border:none;
border-radius:8px;
cursor:pointer;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th{
background:#0066ff;
color:#fff;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:center;
}

.delete{
background:red;
padding:6px 12px;
border-radius:5px;
color:#fff;
border:none;
cursor:pointer;
}
</style>

</head>
<body>

<header>
Redeem Code Management
</header>

<div class="container">

<input type="text" placeholder="Redeem Code">

<input type="number" placeholder="Reward Amount">

<button>Create Code</button>

<table>

<tr>
<th>Code</th>
<th>Reward</th>
<th>Action</th>
</tr>

<tr>
<td>FF100</td>
<td>100৳</td>
<td><button class="delete">Delete</button></td>
</tr>

<tr>
<td>WELCOME50</td>
<td>50৳</td>
<td><button class="delete">Delete</button></td>
</tr>

</table>

</div>

</body>
</html>
