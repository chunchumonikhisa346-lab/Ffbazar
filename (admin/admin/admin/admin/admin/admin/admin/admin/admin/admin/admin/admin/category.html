<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Category Management</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6fb;
}

header{
background:#0066ff;
color:#fff;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
max-width:700px;
margin:20px auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
}

button{
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
background:#0066ff;
color:#fff;
width:100%;
font-size:16px;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th{
background:#0066ff;
color:#fff;
padding:10px;
}

td{
padding:10px;
text-align:center;
border-bottom:1px solid #ddd;
}

.edit{
background:#28a745;
}

.delete{
background:#dc3545;
margin-top:5px;
}
</style>
</head>

<body>

<header>
Category Management
</header>

<div class="container">

<input type="text" placeholder="Category Name">

<button>Add Category</button>

<table>

<tr>
<th>ID</th>
<th>Category</th>
<th>Action</th>
</tr>

<tr>
<td>1</td>
<td>Weekly Membership</td>
<td>
<button class="edit">Edit</button>
<button class="delete">Delete</button>
</td>
</tr>

<tr>
<td>2</td>
<td>Monthly Membership</td>
<td>
<button class="edit">Edit</button>
<button class="delete">Delete</button>
</td>
</tr>

<tr>
<td>3</td>
<td>Level Up Pass</td>
<td>
<button class="edit">Edit</button>
<button class="delete">Delete</button>
</td>
</tr>

</table>

</div>

</body>
                           </html>
