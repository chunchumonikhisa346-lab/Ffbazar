<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products - FF Bazar Admin</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6fb;
}

header{
background:#0066ff;
color:#fff;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
max-width:700px;
margin:20px auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:14px;
margin-top:20px;
background:#0066ff;
color:#fff;
border:none;
border-radius:8px;
font-size:17px;
cursor:pointer;
}

.product{
margin-top:20px;
padding:15px;
background:#f8f8f8;
border-radius:10px;
}
</style>

</head>
<body>

<header>
Manage Products
</header>

<div class="container">

<label>Product Name</label>
<input type="text" placeholder="Weekly / Monthly">

<label>Price</label>
<input type="number" placeholder="Price">

<label>Image URL</label>
<input type="text" placeholder="https://...">

<button>Add Product</button>

<div class="product">
<h3>Weekly Membership</h3>
<p>Price: ৳170</p>
<button>Edit</button>
<button style="background:red;">Delete</button>
</div>

</div>

</body>
  </html>
